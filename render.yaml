# Render Blueprint (render.com → New → Blueprint → pick this repo).
# ONE web service runs the whole backend (gateway + core + reflect + bridge) in one process: node mono.js.
# One URL, one cold start, one place for secrets. The web app goes to Vercel (root directory apps/web,
# env VITE_API_URL = this service's URL). Secrets marked `sync: false` are asked for in the Render dashboard
# and never live in git. (The four-service layout is in DEPLOY.md if you ever need to scale them apart.)
services:
  - type: web
    name: sevasetu
    runtime: node
    plan: free
    # production packages only: the test-only mongodb-memory-server would download a 100 MB MongoDB binary
    buildCommand: npm ci --omit=dev
    startCommand: node mono.js
    healthCheckPath: /health/all
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGOMS_DISABLE_POSTINSTALL   # belt and braces: never download a test MongoDB on the server
        value: "1"
      - key: MONGO_URI              # Atlas connection string, e.g. mongodb+srv://…/sevasetu (core and reflect share it)
        sync: false
      - key: JWT_SECRET             # any long random string
        generateValue: true
      - key: WEB_ORIGIN             # the Vercel URL of the web app (CORS); leave empty until you have it
        sync: false
      - key: SEED_ON_START          # fills an EMPTY database with the demo data on first boot; never touches a filled one
        value: "true"
      - key: WISDOM_TIME_ZONE
        value: Asia/Kolkata
      # ---- LLM (Groq). Without a key every AI job uses its rule-based fallback.
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL              # no model name is written in the code
        value: openai/gpt-oss-120b
      - key: LLM_RESPONSE_FORMAT
        value: json_schema
      - key: LLM_REASONING_EFFORT
        value: low
      - key: LLM_TEMPERATURE
        value: "0"
      # ---- speech: Bhashini first, then Groq audio, then the browser's own
      - key: LANGUAGE_PROVIDER
        value: bhashini
      - key: SPEECH_TO_TEXT
        value: bhashini,groq
      - key: TEXT_TO_SPEECH
        value: bhashini,groq
      - key: TRANSLATION
        value: bhashini
      - key: BHASHINI_USER_ID
        sync: false
      - key: BHASHINI_ULCA_API_KEY
        sync: false
      - key: BHASHINI_INFERENCE_API_KEY
        sync: false
      - key: BHASHINI_PIPELINE_ID
        value: 64392f96daac500b55c543cd
      - key: BHASHINI_TTS_GENDER
        value: female
      - key: GROQ_STT_MODEL
        value: whisper-large-v3
      - key: GROQ_TTS_MODEL
        value: canopylabs/orpheus-v1-english
      - key: DRAFT_TIMEOUT_MS
        value: "8000"
      - key: TRANSLATE_TIMEOUT_MS
        value: "4000"
