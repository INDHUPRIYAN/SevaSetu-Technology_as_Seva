# Render Blueprint (render.com → New → Blueprint → pick this repo): the four backend services.
# Secrets marked `sync: false` are asked for in the Render dashboard; they never live in git.
# The web app goes to Vercel: root directory apps/web, env VITE_API_URL = the gateway URL.
# One-service alternative: a single web service with start command `node mono.js`
# (MONGO_URI, JWT_SECRET, and the bridge keys if you have them).
services:
  - type: web
    name: sevasetu-core
    runtime: node
    buildCommand: npm ci
    startCommand: node services/core/src/server.js
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI          # Atlas connection string ending in /seva_core
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: web
    name: sevasetu-reflect
    runtime: node
    buildCommand: npm ci
    startCommand: node services/reflect/src/server.js
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI          # the same cluster, ending in /seva_reflect
        sync: false
      - key: WISDOM_TIME_ZONE
        value: Asia/Kolkata

  - type: web
    name: sevasetu-bridge
    runtime: node
    buildCommand: npm ci
    startCommand: node services/bridge/src/server.js
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEY        # Groq key; without it, Post a Need uses the fallback draft
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: BHASHINI_USER_ID   # without these, the mic and Tamil translation are skipped
        sync: false
      - key: BHASHINI_ULCA_API_KEY
        sync: false
      - key: BHASHINI_PIPELINE_ID
        value: 64392f96daac500b55c543cd

  - type: web
    name: sevasetu-gateway
    runtime: node
    buildCommand: npm ci
    startCommand: node services/gateway/src/server.js
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET         # the same value as core's
        sync: false
      - key: CORE_URL           # each service's URL from the Render dashboard, e.g. https://sevasetu-core.onrender.com
        sync: false
      - key: REFLECT_URL
        sync: false
      - key: BRIDGE_URL
        sync: false
      - key: WEB_ORIGIN         # the Vercel URL of the web app
        sync: false
